# ==================================================================
#  Active environment: qa | uat
#  Override at runtime with: mvn test -Denv=uat
# ==================================================================
env=qa

# Applications under test. A feature file tagged @app1 / @app2 uses that app's settings.
applications=app1,app2

# ==================================================================
#  Parallel execution
#  parallel.execution=true  -> scenarios run concurrently, one browser per thread
#  thread.count             -> number of scenarios running at the same time
#  Override at runtime with: mvn test -Dparallel.execution=false -Dthread.count=5
# ==================================================================
parallel.execution=true
thread.count=3

# ==================================================================
#  Re-running failed scenarios
#  rerun.count -> how many more times a failed scenario is run within the same run (0 = never).
#                 e.g. 3 = up to 3 more attempts; it stops as soon as one attempt passes.
#                 Only real failures are retried, not undefined/pending steps.
#                 Reports show the final attempt; a scenario that passed on a retry is tagged "retried".
#  Scenarios still failing at the end are listed in target/cucumber-reports/rerun.txt.
#  To run only those afterwards:  mvn test -Dsuite.xml=testng-rerun.xml
#  Override at runtime with: mvn test -Drerun.count=2
# ==================================================================
rerun.count=1

# ==================================================================
#  Test results
#  Every suite execution gets its own folder inside report.folder (relative to the project folder):
#    TestRun_<ENV>_<yyyy-MM-dd_HH-mm-ss>/
#      TestReport_<ENV>_<yyyy-MM-dd_HH-mm-ss>.html   Cucumber HTML report (screenshots + video links)
#      ExtentReport_<ENV>_<yyyy-MM-dd_HH-mm-ss>.html Extent report (see "Extent report" below)
#      cucumber.json, rerun.txt                       raw results / scenarios still failing after retries
#      Videos/                                        one video per scenario (see below)
#  report.history.count -> number of latest run folders to keep; older ones are deleted (0 = keep all)
# ==================================================================
report.folder=Test Results
report.history.count=10

# ==================================================================
#  Extent report (ExtentReports Spark)
#  extent.report.enabled -> true = write ExtentReport_<run>.html into the run folder
#  extent.config.file    -> theme, titles, time format, custom CSS/JS (relative to the project folder)
#  extent.view.order     -> tabs in the report's side menu, first one opens by default:
#                           dashboard, test, category, device, author, exception, log
#  Override at runtime with: mvn test "-Dextent.report.enabled=false"
# ==================================================================
extent.report.enabled=true
extent.config.file=src/test/resources/extent-config.xml
extent.view.order=dashboard,test,category,device,exception,log

# ==================================================================
#  Screenshots (Cucumber and Extent reports)
#  screenshot.capture -> failed = the step that failed, all = after every UI step, none = never
# ==================================================================
screenshot.capture=failed

# ==================================================================
#  Video recording (Chrome and Edge; works headless and in parallel)
#  Each UI scenario is saved as its own .avi file in the run folder's Videos/ sub-folder
#  and linked from the HTML report.
#  video.recording -> true = record, false = do not record
#  video.save.for  -> all = keep every scenario's video, failed = keep only failed scenarios
#  video.fps       -> frames per second in the saved video (higher = smoother, larger files)
#  video.quality   -> JPEG quality of each frame, 1-100
#  Override at runtime with: mvn test "-Dvideo.recording=false"
# ==================================================================
video.recording=true
video.save.for=all
video.fps=5
video.quality=60

